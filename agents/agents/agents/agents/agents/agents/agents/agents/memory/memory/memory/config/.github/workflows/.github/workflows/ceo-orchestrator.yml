name: CEO orchestrator

# يجري تشغيل الوكيل بطلب واحد. ترتيب مزودي النماذج متسلسل وثابت،
# ولا يبدأ مزود بديل إلا إذا أخفق السابق أو تعذر استخدام حصته.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: موضوع أو موجز الحملة
        required: true
        type: string
      audience:
        description: الجمهور المستهدف (اختياري)
        required: false
        type: string
        default: غير محدد

permissions:
  contents: read
  models: read

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prepare output
        run: mkdir -p reports
      - name: Run CEO with sequential free-model fallback
        env:
          TOPIC: ${{ inputs.topic }}
          AUDIENCE: ${{ inputs.audience }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OTHER_FREE_BASE_URL: ${{ secrets.OTHER_FREE_BASE_URL }}
          OTHER_FREE_API_KEY: ${{ secrets.OTHER_FREE_API_KEY }}
          OTHER_FREE_MODEL: ${{ vars.OTHER_FREE_MODEL }}
        run: |
          python scripts/run_agent.py \
            --agent agents/ceo.md \
            --task "أنشئ خطة وكالة لموضوع: ${TOPIC}. الجمهور: ${AUDIENCE}. أخرج الهدف والرسائل والمهام المتسلسلة والمسؤوليات ومخرجات الباحث وكاتب النصوص والمنتج والناشر، ثم نقاط الجودة والحوكمة. لا تنشر المحتوى ولا تفترض حقائق غير معطاة. اجعل كل نشر خاضعًا لموافقة بشرية." \
            --output reports/ceo-orchestration.md
      - uses: actions/upload-artifact@v4
        with:
          name: ceo-orchestration
          path: reports/ceo-orchestration.md
          if-no-files-found: error
